[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-pc"
version = "0.1.0"
description = "Just A Rather Very Intelligent System — Windows PC butler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.1,<7",
  "pystray>=0.19.5,<0.20",
  "Pillow>=10.0.0,<12",
  "pynput>=1.7.6,<2",
  "ToJyutping>=3.0,<4",
  "nvidia-ml-py>=12.535.0,<13",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]
ear = [
  "sounddevice>=0.4.6,<0.6",
  "numpy>=1.24,<3",
  "funasr>=1.1.0,<2",
  "torch>=2.0.0,<3",
  "torchaudio>=2.0.0,<3",
]
wake = [
  "jarvis-pc[ear]",
  "openwakeword>=0.6.0,<0.7",
  # ⚠️ 2026-08-31: onnxruntime 1.28 makes openwakeword output all-zeros
  # (model inference broken). Pin <1.28 — 1.27 verified working.
  "onnxruntime>=1.16.0,<1.28",
  "piper-tts>=1.5.0,<2",
]
aec = [
  "pyaec>=1.0.0,<2",
  "pyaudiowpatch>=0.2.0,<1",
]
speaker = [
  "speechbrain>=1.0.0,<2",
]
alerts = [
  "winrt-runtime>=3.0,<4",
  "winrt-Windows.Foundation>=3.0,<4",
  "winrt-Windows.Foundation.Collections>=3.0,<4",
  "winrt-Windows.UI.Notifications>=3.0,<4",
  "winrt-Windows.UI.Notifications.Management>=3.0,<4",
  "winrt-Windows.ApplicationModel>=3.0,<4",
  "comtypes>=1.4.0,<2",
  "mcp>=1.0,<2",
  "uvicorn>=0.30,<1",
  "starlette>=0.37,<1",
]

[project.scripts]
jarvis = "jarvis.__main__:main"
jarvis-mcp = "jarvis.mcp_alerts_http:main"

[tool.setuptools.packages.find]
where = ["src"]
