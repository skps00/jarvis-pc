[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-pc"
version = "0.1.0"
description = "Just A Rather Very Intelligent System — Windows PC butler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.1,<7",
  "pystray>=0.19.5,<0.20",
  "Pillow>=10.0.0,<12",
  "pynput>=1.7.6,<2",
  "ToJyutping>=3.0,<4",
]

[project.optional-dependencies]
ear = [
  "sounddevice>=0.4.6,<0.6",
  "numpy>=1.24,<3",
  "funasr>=1.1.0,<2",
  "torch>=2.0.0",
  "torchaudio>=2.0.0",
]
wake = [
  "jarvis-pc[ear]",
  "openwakeword>=0.6.0,<0.7",
  "onnxruntime>=1.16.0,<2",
]
alerts = [
  "winrt-runtime>=3.0,<4",
  "winrt-Windows.Foundation>=3.0,<4",
  "winrt-Windows.Foundation.Collections>=3.0,<4",
  "winrt-Windows.UI.Notifications>=3.0,<4",
  "winrt-Windows.UI.Notifications.Management>=3.0,<4",
  "winrt-Windows.ApplicationModel>=3.0,<4",
  "comtypes>=1.4.0,<2",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
