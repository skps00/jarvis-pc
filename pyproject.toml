[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-pc"
version = "0.1.0"
description = "Just A Rather Very Intelligent System — Windows PC butler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.1,<7",
  "pystray>=0.19.5,<0.20",
  "Pillow>=10.0.0,<12",
  "pynput>=1.7.6,<2",
]

[project.optional-dependencies]
ear = [
  "sounddevice>=0.4.6,<0.6",
  "numpy>=1.24,<3",
  "funasr>=1.1.0,<2",
  "torch>=2.0.0",
  "torchaudio>=2.0.0",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
